# Continuous build for a generated service (automatic, on push to main).
#
# lint -> test -> build -> scan -> push an IMMUTABLE image tagged by commit SHA to GHCR.
# It does NOT deploy: promotion to the cluster is a separate, manual step in `deploy.yml`
# (the developer's click is the gate). Keeping build and deploy in different workflows means
# a push never shows a confusing "skipped" deploy job, and the Deploy button is a dedicated
# workflow the developer can find and run on demand.
#
# This file is generic (uses ${{ github.* }} context) and is copied verbatim into each service.
name: ci

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write
  statuses: write   # publica atlas/scan e atlas/coverage no commit (lidos pelo gate day-2)

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - name: Test (com cobertura)
        id: cover
        run: |
          go test ./... -coverprofile=cover.out || true
          pct="$(go tool cover -func=cover.out 2>/dev/null | awk '/^total:/{gsub(/%/,"",$3); print int($3)}')"
          echo "pct=${pct:-0}" >> "$GITHUB_OUTPUT"
      - run: go build ./...
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable image (tag = commit SHA)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Scan image (trivy, sem CRITICAL)
        id: scan
        continue-on-error: true
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ghcr.io/${{ github.repository }}:${{ github.sha }}
          severity: CRITICAL
          exit-code: "1"
      - name: Publica status de conformidade no commit (lido pela atlas-api)
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          scan_state=success; [ "${{ steps.scan.outcome }}" = "failure" ] && scan_state=failure
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="$scan_state" -f context="atlas/scan" -f description="trivy CRITICAL"
          gh api -X POST "repos/${{ github.repository }}/statuses/${{ github.sha }}" \
            -f state="success" -f context="atlas/coverage" -f description="${{ steps.cover.outputs.pct }}%"
