# Continuous build for a generated service (automatic, on push to main).
#
# lint -> test -> build -> scan -> push an IMMUTABLE image tagged by commit SHA to GHCR.
# It does NOT deploy: promotion to the cluster is a separate, manual step in `deploy.yml`
# (the developer's click is the gate). Keeping build and deploy in different workflows means
# a push never shows a confusing "skipped" deploy job, and the Deploy button is a dedicated
# workflow the developer can find and run on demand.
#
# This file is generic (uses ${{ github.* }} context) and is copied verbatim into each service.
name: ci

on:
  push:
    branches: [main]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - run: go test ./...
      - run: go build ./...
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push immutable image (tag = commit SHA)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ghcr.io/${{ github.repository }}:${{ github.sha }}
      - name: Scan image
        run: |
          echo "TODO image scan (e.g. trivy) on ghcr.io/${{ github.repository }}:${{ github.sha }}"
