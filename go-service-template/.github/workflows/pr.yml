# Pull Request validation: runs before the merge (publishes nothing).
#
# lint -> test -> build -> build the image (NO push) -> scan. Fails the PR on a CRITICAL
# vulnerability or if the build/tests break. It does NOT push the image, publish release
# statuses or deploy — that is ci.yml's responsibility (after the merge).
#
# This file is generic (uses ${{ github.* }} context) and is copied verbatim into each service.
name: pr

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - run: go vet ./...
      - name: Static analysis (staticcheck)
        run: |
          go install honnef.co/go/tools/cmd/staticcheck@2025.1.1
          "$(go env GOPATH)/bin/staticcheck" ./...
      - name: Test (coverage >= 60%)
        run: |
          go test ./... -coverprofile=cover.out
          pct="$(go tool cover -func=cover.out | awk '/^total:/{gsub(/%/,"",$3); print int($3)}')"
          echo "coverage ${pct}%"
          [ "${pct:-0}" -ge 60 ] || { echo "coverage ${pct}% < 60%"; exit 1; }
      - run: go build ./...
      - name: Build image (no push)
        run: docker build -t "atlas-pr:${{ github.sha }}" .
      - name: Scan image (trivy, no CRITICAL)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: "atlas-pr:${{ github.sha }}"
          severity: CRITICAL
          exit-code: "1"
