# Local development environment — generated by Atlas (ADR atlas-templates/0008).
# `docker compose up --build` runs the service as it runs in the cluster, with the same
# runtime variables. This is NOT production: delivery still flows through Git + Argo CD.
#
# This is the NO-database shape (the default scaffold). When a service declares
# `database.enabled`, Atlas regenerates this file adding a `postgres` service and
# injecting DB_HOST/DB_PORT + POSTGRES_* into the app (ADR atlas-templates/0007).
services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
